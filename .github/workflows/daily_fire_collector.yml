name: Daily Fire Data Auto Collector (06:30 KST)

on:
  schedule:
    # 21:30 UTC = 매일 한국시간(KST) 오전 06:30
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl beautifulsoup4

      - name: Run Daily NFA OpenAPI Auto Updater
        run: |
          python scripts/daily_nfa_openapi_updater.py

      - name: Run YouTube Fire News Collector
        run: |
          python scripts/youtube_fire_news_collector.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/*.json data_export/
          if git diff --staged --quiet; then
            echo "No new data found today. Database is already up to date."
          else
            git commit -m "[Auto-Update] Daily NFA OpenAPI fire data and YouTube fire news update"
            git push
          fi
